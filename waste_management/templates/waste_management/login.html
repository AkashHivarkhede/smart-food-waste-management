{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Smart Food</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>

  <body class="login-page">
    <!--     =========================================
         LOGIN CONTAINER
         =========================================     -->

    <div class="login-container">
      <!--     =====================================
             BRAND
             =====================================     -->

      <div class="login-brand">
        <div class="login-brand-icon">
          <!-- Real SVG logo -->

          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 6H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

            <path d="M9 3L7 6L9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

            <path d="M17 6L19 9L17 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

            <path d="M17 18H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

            <path d="M15 15L17 18L15 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

            <path d="M7 18L5 15L7 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <h1>Smart Food</h1>

        <p>Waste Management</p>
      </div>

      <!--     =====================================
             LOGIN CARD
             =====================================     -->

      <div class="login-card">
        <div class="login-header">
          <h2>Welcome Back</h2>

          <p>Sign in to access your management dashboard.</p>
        </div>

        <!--     =================================
                 DJANGO MESSAGES
                 =================================     -->

        {% if messages %}
          {% for message in messages %}
            <div class="login-message">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <!--     =================================
                 LOGIN FORM
                 =================================     -->

        <form method="POST" class="login-form">
          {% csrf_token %}

          <!-- USERNAME -->

          <div class="form-group">
            <label for="username">Username</label>

            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" required />
          </div>

          <!-- PASSWORD -->

          <div class="form-group">
            <label for="password">Password</label>

            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required />
          </div>

          <!-- LOGIN BUTTON -->

          <button type="submit" class="primary-btn login-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 3H19C20.1046 3 21 3.89543 21 5V19C21 20.1046 20.1046 21 19 21H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

              <path d="M10 17L15 12L10 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

              <path d="M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>Login
          </button>
        </form>
      </div>

      <!--     =====================================
             FOOTER
             =====================================     -->

      <div class="login-footer">
        <span>Smart Food Waste Management System</span>
      </div>
    </div>
  </body>
</html>
